interface:
  display_name: "CA Study"
  short_description: "Crypto ratings, tokenomics and market-cap entry zones"
  default_prompt: "使用 $ca-study 分析这个 CA：必须按固定代币经济格式逐行写总量/流通百分比、营收分配（真实版本逐版）、利润分配、回购机制/当前回购比例、销毁机制/当前销毁比例；每项比例写清分母、给谁、用途、哪个代币、核查时间与证据状态，缺项写未核实；区分收入用途与累计回购/销毁供应占比，并分析分配、解锁增发、分红及评级影响；Meme 看未来一周催化、1–2 个月机会和发射台扶持；早期应用比较同类估值及小仓预期机会，核验大户与捆绑筹码；再结合 1h/4h/日线、真实运营天数与 ATH 两档跌幅规则，给出市值首笔区、78.6% 参考位、确认和失效位；运营至少 7 天且可交易的项目应给有依据的条件价位，时间越久可考虑较浅回调，但年龄不证明安全；结尾按最终投资评级、综合、当前赔率、当前策略、买入策略五行输出。"
